<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="Origin-Agent-Cluster" content="?1" />
    <title>3D Scan</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #canvas-host {
        width: 100%;
        height: 100%;
        position: relative;
        background: #c5cdd6;
      }
      #status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        text-align: center;
        background: #c5cdd6;
        color: #374151;
        font: 14px system-ui, -apple-system, sans-serif;
        z-index: 2;
      }
      #status.hidden {
        display: none;
      }
    </style>
    <script src="site-base.js"></script>
  </head>
  <body>
    <div id="canvas-host">
      <div id="status">Loading 3D model…</div>
    </div>
    <script type="module" src="rock-viewer.js"></script>
  </body>
</html>
